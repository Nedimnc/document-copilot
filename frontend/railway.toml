# Railway service: set Root Directory to `frontend` in the dashboard.
# Build-time env: VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
[build]
builder = "NIXPACKS"
buildCommand = "npm install -g pnpm && pnpm install && pnpm build"

[deploy]
startCommand = "pnpm exec vite preview --host 0.0.0.0 --port ${PORT:-4173}"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
