<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Document Copilot architecture</title>
  <desc id="desc">Analyst browser, Railway-hosted frontend and API, Supabase auth and Postgres retrieval store, OpenAI, and offline SEC ingestion.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0369a1"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="580" fill="#ffffff"/>

  <text x="480" y="36" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#0f172a">Document Copilot  architecture overview</text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="13" fill="#64748b">Live chat path (solid) · Corpus ingestion (dashed, offline CLI)</text>

  <!-- Browser -->
  <rect x="340" y="78" width="280" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="480" y="102" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#64748b">BROWSER</text>
  <text x="480" y="124" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#0f172a">React SPA (Vite + TypeScript)</text>
  <text x="480" y="142" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">Chat UI · citations · Supabase session</text>

  <!-- Railway group -->
  <rect x="48" y="188" width="864" height="148" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="68" y="212" font-family="system-ui, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#92400e">RAILWAY</text>
  <text x="68" y="228" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#b45309">Two services · same Supabase project in every environment</text>

  <rect x="80" y="244" width="260" height="76" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="210" y="268" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Static frontend</text>
  <text x="210" y="288" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">pnpm build · SPA fallback</text>
  <text x="210" y="304" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">AI SDK ’ SSE chat stream</text>

  <rect x="620" y="244" width="260" height="76" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="750" y="268" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0f172a">FastAPI + Uvicorn</text>
  <text x="750" y="288" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">Auth · threads · hybrid retrieval</text>
  <text x="750" y="304" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">PydanticAI · citation validation</text>

  <!-- Supabase group -->
  <rect x="48" y="360" width="420" height="168" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="68" y="384" font-family="system-ui, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#047857">SUPABASE</text>

  <rect x="80" y="400" width="160" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="160" y="424" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Auth</text>
  <text x="160" y="444" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">Email + JWT</text>
  <text x="160" y="464" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">Browser sign-in</text>
  <text x="160" y="484" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">API verifies Bearer</text>

  <rect x="276" y="400" width="172" height="108" rx="8" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="362" y="424" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Postgres</text>
  <text x="362" y="444" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">profiles · chat threads</text>
  <text x="362" y="460" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">source_documents</text>
  <text x="362" y="476" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">document_chunks</text>
  <text x="362" y="492" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#0369a1" font-weight="600">pgvector + FTS · RRF</text>

  <!-- OpenAI -->
  <rect x="492" y="400" width="200" height="108" rx="8" fill="#f0f9ff" stroke="#7dd3fc" filter="url(#shadow)"/>
  <text x="592" y="424" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0369a1">OPENAI</text>
  <text x="592" y="448" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Chat + embeddings</text>
  <text x="592" y="468" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">Answer generation</text>
  <text x="592" y="484" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">Query + chunk vectors</text>

  <!-- Offline ingest -->
  <rect x="712" y="360" width="200" height="168" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="812" y="384" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#475569">OFFLINE INGEST</text>
  <text x="812" y="408" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0f172a">SEC EDGAR ’ data/</text>
  <text x="812" y="428" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">download · Docling</text>
  <text x="812" y="444" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">load_documents</text>
  <text x="812" y="460" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#475569">chunk_and_embed</text>
  <text x="812" y="484" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#64748b">CLI only · no HTTP API</text>

  <!-- Chat turn callout -->
  <rect x="48" y="544" width="864" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="480" y="563" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#334155">
    Chat turn: retrieve top passages ’ LLM (buffered) ’ validate [n] citations ’ stream answer or refusal ’ persist messages + excerpts
  </text>

  <!-- Arrows: browser to frontend -->
  <path d="M 420 150 L 210 244" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="188" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#64748b">static assets</text>

  <!-- browser to auth -->
  <path d="M 400 150 L 160 400" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="268" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#64748b">JWT session</text>

  <!-- browser/API to backend -->
  <path d="M 540 150 L 750 244" fill="none" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="668" y="188" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#0369a1">REST + SSE /chat</text>

  <!-- backend to auth -->
  <path d="M 680 320 L 200 400" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="348" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#64748b">verify JWT</text>

  <!-- backend to postgres -->
  <path d="M 750 320 L 362 400" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="348" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#64748b">SQLAlchemy async</text>

  <!-- backend to openai -->
  <path d="M 820 320 L 592 400" fill="none" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- ingest to postgres -->
  <path d="M 712 460 L 448 460" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="580" y="452" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#64748b">writes chunks</text>

  <!-- ingest to openai -->
  <path d="M 712 420 L 692 420" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M 692 420 L 692 448 L 592 448" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="648" y="412" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#64748b">embed batches</text>
</svg>
